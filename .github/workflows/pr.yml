name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --new-from-rev=origin/main

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Check coverage thresholds
        run: |
          go test -cover ./... | tee coverage-summary.txt

          echo "Checking per-package coverage..."

          # The module path is read from go.mod rather than hardcoded. It was
          # previously pinned to the pre-rename "github.com/echotools/nevr-tape/v1",
          # so the grep matched nothing, the loop body never ran, and this job
          # passed unconditionally regardless of actual coverage.
          module=$(awk '/^module /{print $2}' go.mod)
          echo "module: $module"

          matched=$(grep -cE "^ok[[:space:]]+$module/pkg/" coverage-summary.txt || true)
          if [ "$matched" -eq 0 ]; then
            echo "FAIL: coverage check matched 0 packages under $module/pkg/ — the gate is not running"
            exit 1
          fi
          echo "matched $matched package(s)"

          # Fed by process substitution, not a pipe: a piped `while` runs in a
          # subshell, where `exit 1` leaves the subshell rather than failing
          # the step.
          failed=0
          while read -r line; do
            pkg=$(echo "$line" | awk '{print $2}')
            percent=$(echo "$line" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p')

            if [ -z "$percent" ]; then
              echo "FAIL: could not parse a coverage percentage from: $line"
              failed=1
              continue
            fi

            if echo "$pkg" | grep -q "/conversion$"; then
              threshold=74.6
            else
              threshold=80.0
            fi

            if (( $(echo "$percent < $threshold" | bc -l) )); then
              echo "FAIL: $pkg has $percent% coverage (threshold: $threshold%)"
              failed=1
            else
              echo "PASS: $pkg has $percent% coverage (threshold: $threshold%)"
            fi
          done < <(grep -E "^ok[[:space:]]+$module/pkg/" coverage-summary.txt)

          exit $failed

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run race detector
        run: go test -race -timeout=5m ./...

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
