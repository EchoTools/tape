name: Main Branch CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run full test suite
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run race detector
        run: go test -race -timeout=5m ./...

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestBackwardCompatibility builds a reader from a pinned
          # baseline via `git archive`, so it needs real history. On a
          # shallow clone it fails rather than skipping, by design.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 ./... | tee current-bench.txt

      - name: Compare with baseline
        run: |
          if [ -f .benchmarks/baseline.txt ]; then
            echo "Comparing benchmarks..."
            benchstat .benchmarks/baseline.txt current-bench.txt > comparison.txt || true
            cat comparison.txt

            if grep -E "\+[0-9]+\.[0-9]+%" comparison.txt; then
              echo "::warning::Performance regression detected"
              regression=$(grep -Eo "\+[0-9]+\.[0-9]+%" comparison.txt | head -1 | tr -d '+%')
              if (( $(echo "$regression > 5.0" | bc -l) )); then
                echo "::error::Regression exceeds 5% threshold: $regression%"
                exit 1
              fi
            fi
          else
            echo "No baseline found, creating initial baseline"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            current-bench.txt
            comparison.txt

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
